services:
  # ─────────────────────────────────────────────
  # PostgreSQL (local DB — skip if using Supabase)
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: order-food-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: order_food_user
      POSTGRES_PASSWORD: order_food_pass
      POSTGRES_DB: ordering_food
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_food_user -d ordering_food"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Backend — Express + Prisma
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: order-food-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      # Override DB to use the local postgres container
      # Comment these 2 lines out if you want to use Supabase instead
      # DATABASE_URL: postgresql://order_food_user:order_food_pass@postgres:5432/ordering_food
      # DIRECT_URL: postgresql://order_food_user:order_food_pass@postgres:5432/ordering_food
      # Point CORS to the local client container
      FRONTEND_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:3001
      PORT: "3001"
      NODE_ENV: development
    volumes:
      # Persist uploaded files between restarts locally
      - ./backend/uploads:/app/uploads
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # ─────────────────────────────────────────────
  # Client — Next.js
  # ─────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_ENDPOINT: http://localhost:3001
        NEXT_PUBLIC_URL: http://localhost:3000
        NEXT_PUBLIC_PREFIX_TAG: v1
    container_name: order-food-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
